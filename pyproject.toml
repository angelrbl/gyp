[project]
name = "lapizarrapeluda"
version = "0.1.0"
description = "Schedule Manager and Team Dashboard"
authors = [
    {name = "Ángel Ramírez"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "nicegui (>=3.16.0,<4.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "werkzeug (>=3.1.8,<4.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
